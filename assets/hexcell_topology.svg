<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" height="100%">
  <defs>
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="640" height="440" rx="12" fill="url(#ringBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="320" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    HEXCELL 6-FOLD SYMMETRICAL LOCK-FREE TOPOLOGY
  </text>
  <text x="320" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
    128-BYTE CACHE-LINE ALIGNED ATOMIC RING BUFFER (APPLE SILICON M4 / POSIX SHM)
  </text>

  <!-- Central Hub -->
  <circle cx="320" cy="210" r="46" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="206" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#60a5fa">CORE</text>
  <text x="320" y="222" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ATOMIC</text>

  <!-- 6 Hexagonal Nodes (R = 115, center 320, 210) -->
  <!-- Node 0: (435, 210) -->
  <line x1="320" y1="210" x2="435" y2="210" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="435" cy="210" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
  <text x="435" y="206" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-0</text>
  <text x="435" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 0</text>

  <!-- Node 1: (378, 110) -->
  <line x1="320" y1="210" x2="378" y2="110" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="378" cy="110" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="378" y="106" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-1</text>
  <text x="378" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 1</text>

  <!-- Node 2: (262, 110) -->
  <line x1="320" y1="210" x2="262" y2="110" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="262" cy="110" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="262" y="106" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-2</text>
  <text x="262" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 2</text>

  <!-- Node 3: (205, 210) -->
  <line x1="320" y1="210" x2="205" y2="210" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="205" cy="210" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="205" y="206" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-3</text>
  <text x="205" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 3</text>

  <!-- Node 4: (262, 310) -->
  <line x1="320" y1="210" x2="262" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="262" cy="310" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="262" y="306" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-4</text>
  <text x="262" y="320" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 4</text>

  <!-- Node 5: (378, 310) -->
  <line x1="320" y1="210" x2="378" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="378" cy="310" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="378" y="306" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-5</text>
  <text x="378" y="320" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 5</text>

  <!-- Ring Connecting Periphery -->
  <polygon points="435,210 378,110 262,110 205,210 262,310 378,310" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Empirical Silicon Hardware Metric Callout Banner -->
  <g transform="translate(40, 360)">
    <rect width="560" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="280" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">
      HOT-SPOT CONTENTION BENCHMARK: 100% COLLISION ON SLOT 0
    </text>
    <text x="280" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#f8fafc">
      p99 Wall: 2.0µs | p99 CPU: 1.25µs | Max CPU: 11.75µs | Throughput: 10.22M ops/s
    </text>
  </g>
</svg>
